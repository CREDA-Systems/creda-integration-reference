<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">CREDA Integration Reference Architecture</title>
  <desc id="desc">Flow from application, agent, or workflow through governance request, CREDA implementation boundary, governance response, infrastructure adapter, and external systems.</desc>

  <style>
    .box { fill: #ffffff; stroke: #222222; stroke-width: 2; rx: 10; }
    .text { font-family: Arial, sans-serif; font-size: 18px; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
    .small { font-family: Arial, sans-serif; font-size: 16px; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
    .line { stroke: #222222; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222222"/>
    </marker>
  </defs>

  <rect class="box" x="275" y="40" width="350" height="60"/>
  <text class="text" x="450" y="70">Application / Agent / Workflow</text>

  <line class="line" x1="450" y1="100" x2="450" y2="135"/>

  <rect class="box" x="300" y="135" width="300" height="60"/>
  <text class="text" x="450" y="165">Governance Request</text>

  <line class="line" x1="450" y1="195" x2="450" y2="230"/>

  <rect class="box" x="275" y="230" width="350" height="60"/>
  <text class="text" x="450" y="260">CREDA Implementation Boundary</text>

  <line class="line" x1="450" y1="290" x2="450" y2="325"/>

  <rect class="box" x="300" y="325" width="300" height="60"/>
  <text class="text" x="450" y="355">Governance Response</text>

  <line class="line" x1="450" y1="385" x2="450" y2="420"/>

  <rect class="box" x="300" y="420" width="300" height="60"/>
  <text class="text" x="450" y="450">Infrastructure Adapter</text>

  <line class="line" x1="450" y1="480" x2="450" y2="515"/>
  <line x1="150" y1="515" x2="750" y2="515" stroke="#222222" stroke-width="2"/>

  <line class="line" x1="150" y1="515" x2="150" y2="565"/>
  <line class="line" x1="450" y1="515" x2="450" y2="565"/>
  <line class="line" x1="750" y1="515" x2="750" y2="565"/>

  <rect class="box" x="40" y="565" width="220" height="60"/>
  <text class="small" x="150" y="595">Blockchain / DLT</text>

  <rect class="box" x="340" y="565" width="220" height="60"/>
  <text class="small" x="450" y="595">API / Application</text>

  <rect class="box" x="640" y="565" width="220" height="60"/>
  <text class="small" x="750" y="595">Enterprise / Legacy</text>
</svg>
